      // Filtered Products
      const filteredProducts = useMemo(() => {
        return products.filter((p) => {
          if (selectedCat !== 'all' && p.category !== selectedCat) return false;
          if (p.price > maxPrice) return false;
          if (selectedCondition !== 'all') {
            if (selectedCondition === 'mint' && !p.condition.toLowerCase().includes('mint') && !p.condition.toLowerCase().includes('like new')) return false;
            if (selectedCondition === 'good' && !p.condition.toLowerCase().includes('good') && !p.condition.toLowerCase().includes('excellent')) return false;
          }
          if (searchQ.trim()) {
            const q = searchQ.toLowerCase();
            return p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q)) || p.location.toLowerCase().includes(q);
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === 'price-low') return a.price - b.price;
          if (sortBy === 'price-high') return b.price - a.price;
          if (sortBy === 'distance') return a.distanceMeters - b.distanceMeters;
          if (sortBy === 'trust') return b.seller.trustScore - a.seller.trustScore;
          if (sortBy === 'views') return b.views - a.views;
          return b.views * b.seller.trustScore - a.views * a.seller.trustScore;
        });
      }, [products, selectedCat, searchQ, sortBy, maxPrice, selectedCondition]);

      // Toggle item in comparator
      const toggleCompare = (id) => {
        if (compareList.includes(id)) {
          setCompareList(compareList.filter(x => x !== id));
        } else {
          if (compareList.length >= 3) {
            triggerToast('Compare Limit', 'You can compare up to 3 items side-by-side.');
            return;
          }
          setCompareList([...compareList, id]);
          triggerToast('Added to Compare', 'Item added to side-by-side comparator.');
        }
      };

      // Load TensorFlow / COCO-SSD Model
      const initDetectionModel = async () => {
        if (cocoModelRef.current) return cocoModelRef.current;
        setIsModelLoading(true);
        try {
          if (window.cocoSsd) {
            cocoModelRef.current = await window.cocoSsd.load();
            setIsModelLoading(false);
            return cocoModelRef.current;
          }
        } catch (e) {
          console.warn('COCO-SSD load error, fallback active', e);
        }
        setIsModelLoading(false);
        return null;
      };

      // Start Real Camera
      const startLiveCamera = async () => {
        setCameraPermissionError(null);
        setCapturedImagePreview(null);
        setDetectedObject(null);
        setDetectionConfidence(null);
        setEditableListing(null);

        try {
          setIsCameraRunning(true);
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
          });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
          await initDetectionModel();
          setIsDetecting(true);
        } catch (err) {
          console.error(err);
          setCameraPermissionError('Camera permission denied or camera device unavailable.');
          setIsCameraRunning(false);
        }
      };

      // Stop Camera
      const stopLiveCamera = () => {
        if (videoRef.current && videoRef.current.srcObject) {
          const stream = videoRef.current.srcObject;
          const tracks = stream.getTracks();
          tracks.forEach(track => track.stop());
          videoRef.current.srcObject = null;
        }
        setIsCameraRunning(false);
        setIsDetecting(false);
      };

      // Continuous Object Detection on Video Loop
      useEffect(() => {
        let animationFrameId;

        const detectFrame = async () => {
          if (isDetecting && videoRef.current && videoRef.current.readyState === 4 && cocoModelRef.current && canvasOverlayRef.current) {
            try {
              const video = videoRef.current;
              const canvas = canvasOverlayRef.current;
              const ctx = canvas.getContext('2d');
              canvas.width = video.videoWidth || 640;
              canvas.height = video.videoHeight || 480;

              const predictions = await cocoModelRef.current.detect(video);
              ctx.clearRect(0, 0, canvas.width, canvas.height);

              if (predictions.length > 0) {
                predictions.sort((a, b) => b.score - a.score);
                const best = predictions[0];
                const [x, y, w, h] = best.bbox;

                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, w, h);

                ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
                ctx.fillRect(x, y, w, h);

                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 15px Manrope, sans-serif';
                ctx.fillText(`${best.class.toUpperCase()} ${Math.round(best.score * 100)}%`, x + 8, y > 24 ? y - 8 : y + 20);

                setDetectedObject(best.class);
                setDetectionConfidence(Math.round(best.score * 100));
              }
            } catch (err) {}
          }
          if (isDetecting) {
            animationFrameId = requestAnimationFrame(detectFrame);
          }
        };

        if (isDetecting) {
          animationFrameId = requestAnimationFrame(detectFrame);
        }

        return () => cancelAnimationFrame(animationFrameId);
      }, [isDetecting]);

      // Capture Snapshot & Build Editable Listing
      const captureFrameAndIdentify = () => {
        let imageUri = 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=800&q=80';
        
        if (videoRef.current) {
          const video = videoRef.current;
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          try {
            imageUri = canvas.toDataURL('image/jpeg');
          } catch(e) {}
        }
        
        setCapturedImagePreview(imageUri);
        stopLiveCamera();

        const detectedName = detectedObject ? (detectedObject.charAt(0).toUpperCase() + detectedObject.slice(1)) : 'Campus Resource';
        const initialListing = {
          name: `${detectedName} (Verified Student Gear)`,
          category: 'electronics',
          condition: 'Like New (9.5/10)',
          description: `Detected ${detectedName} in good physical condition. Tested and available for student borrow.`,

          tags: 'campus, verified, student, gear',

          confidence: detectionConfidence || 94
        };

        setEditableListing(initialListing);
        triggerToast('Object Identified', `Detected ${detectedName} (${detectionConfidence || 94}% confidence). Review details below.`);
      };

      // Publish Final Listing
      const handlePublishFinalListing = (e) => {
        e.preventDefault();
        if (!editableListing) return;

        const newP = {
          id: 'p-' + Date.now(),
          title: editableListing.name,
          category: editableListing.category,
          description: editableListing.description,
          price: Number(editableListing.price),
          hourlyRate: Number(editableListing.hourlyRate),
          dailyRate: Number(editableListing.dailyRate),

          distanceMeters: 120,
          walkTimeMinutes: 2,
          tags: editableListing.tags.split(',').map(t => t.trim()),
          views: 1,
          likes: 0,
          status: 'active'
        };

        setProducts([newP, ...products]);
        setCapturedImagePreview(null);
        setEditableListing(null);
        setActiveTab('explore');
        triggerToast('Resource Published!', 'Your listing is now live across the campus network!');

      // AI Chat Send
      const handleAiSend = (queryText) => {
        const text = queryText || aiInput;
        if (!text.trim()) return;

        const newMsg = { sender: 'user', text };
        setAiMessages(prev => [...prev, newMsg]);
        setAiInput('');
        setAiIsTyping(true);

        setTimeout(() => {
          let reply = '';
          const q = text.toLowerCase();

            reply = '💻 I recommend the **MacBook Pro 16" M2** in Computer Lab 4 (32GB RAM) for ₹80/hr, or check the **Dell 24" UltraSharp IPS Monitor** for dual-screen hostel work!';
          } else if (q.includes('calculator') || q.includes('exam')) {

                    </div>
                    <p className="text-xs text-neutral-400">Computer Engg • 3rd Year • Roll: 22CE1048</p>
                    <p className="text-xs text-emerald-400 font-semibold mt-1">Hostel 3, Room 214 • Top 2% Super Lender</p>
                  </div>
                </div>

                {/* Circular Trust Score Meter */}
                <div className="p-6 rounded-3xl bg-neutral-900 border border-neutral-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-neutral-400 uppercase font-semibold">Campus Trust Score</span>
                    <div className="text-3xl font-black text-emerald-400 mt-1">{userTrustScore}/100</div>
                    <p className="text-xs text-neutral-300 mt-0.5">
                      Last Updated: <strong className="text-white">{trustScoreReason}</strong>
                    </p>
                  </div>
                  <div className="text-right">
                    <span className="text-xs text-neutral-400 block">Exchanges Completed: <strong>18</strong></span>
                    <span className="text-xs text-emerald-400 block">Dispute Free: <strong>100%</strong></span>
                  </div>
                </div>

                {/* Earned Badges */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  {[
                    { label: 'Campus Verified', icon: '🛡️', desc: 'ID verified' },
                    { label: 'Super Lender', icon: '⭐', desc: '18 exchanges' },
                    { label: 'Punctual Hero', icon: '⏱️', desc: '100% on-time' },
                    { label: 'Flawless Care', icon: '✨', desc: 'Zero disputes' }
                  ].map((b, i) => (
                    <div key={i} className="p-3.5 rounded-2xl bg-neutral-950 border border-neutral-800 text-center space-y-1">
                      <span className="text-2xl block">{b.icon}</span>
                      <strong className="text-xs text-white block">{b.label}</strong>
                      <span className="text-[10px] text-neutral-500">{b.desc}</span>
                    </div>
                  ))}
                </div>

              </div>
            )}

            {/* VIEW 7: DEDICATED ADMIN HUB */}
            {activeTab === 'admin' && (
              <div className="space-y-6 animate-fadeSlideUp">
                
                <div className="p-6 rounded-3xl bg-gradient-to-r from-amber-500/10 via-neutral-900 to-neutral-950 border border-amber-500/30 flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-black text-white flex items-center gap-2">
                      <span>⚡ Campus Circular Operations & Arbitration Hub</span>
                      <span className="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded font-bold">ADMIN ROLE</span>
                    </h2>
                    <p className="text-xs text-neutral-400">Escrow monitoring, fee configuration, and dispute arbitration workbench</p>
                  </div>
                </div>

                {/* 4 Admin KPI Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="p-4 rounded-2xl bg-neutral-900 border border-neutral-800">
                    <span className="text-xs text-neutral-400">Active Escrow Value</span>
                    <div className="text-xl font-bold text-emerald-400 mt-1">₹42,800</div>
                  </div>
                  <div className="p-4 rounded-2xl bg-neutral-900 border border-neutral-800">
                    <span className="text-xs text-neutral-400">Platform Revenue (5%)</span>
                    <div className="text-xl font-bold text-white mt-1">₹3,420</div>
                  </div>
                  <div className="p-4 rounded-2xl bg-neutral-900 border border-neutral-800">
                    <span className="text-xs text-neutral-400">Open Disputes</span>
                    <div className="text-xl font-bold text-amber-400 mt-1">0 Active</div>
                  </div>
                  <div className="p-4 rounded-2xl bg-neutral-900 border border-neutral-800">
                    <span className="text-xs text-neutral-400">Overdue Returns</span>
                    <div className="text-xl font-bold text-neutral-300 mt-1">0 Overdue</div>
                  </div>
                </div>

                {/* Platform Fee Rate Slider */}
                <div className="p-6 rounded-3xl bg-neutral-900 border border-neutral-800 space-y-2">
                  <div className="flex justify-between text-xs font-bold">
                    <span>Configurable Campus Platform Fee Rate:</span>
                    <span className="text-emerald-400">{platformFeeRate}%</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="15"
                    value={platformFeeRate}
                    onChange={(e) => setPlatformFeeRate(Number(e.target.value))}
                    className="w-full accent-emerald-500 bg-neutral-800 h-2 rounded-lg cursor-pointer"
                  />
                  <p className="text-[11px] text-neutral-500">Formula: Borrowing Charge + {platformFeeRate}% Platform Fee + Refundable Deposit = Escrow Lock</p>
                </div>

              </div>
            )}

          </main>

          {/* ==========================================
              GLOBAL MODALS (ALL ORIGINAL PRESERVED)
              ========================================== */}

          {/* 1. FLOATING COMPARATOR DOCK */}
          {compareList.length > 0 && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 max-w-md w-[92%] p-3.5 rounded-2xl bg-neutral-900/95 border border-emerald-500/50 shadow-2xl flex items-center justify-between backdrop-blur-xl animate-fadeSlideUp">
              <span className="text-xs font-bold text-white">
                {compareList.length} of 3 items selected
              </span>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setCompareList([])}
                  className="px-2.5 py-1 text-xs text-neutral-400 hover:text-white"
                >
                  Clear
                </button>
                <button
                  onClick={() => setIsCompareOpen(true)}
                  className="py-1.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs rounded-xl shadow-md"
                >
                  Compare Side-by-Side
                </button>
              </div>
            </div>
          )}

          {/* 2. RESOURCE DETAIL MODAL */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeSlideUp">
              <div className="w-full max-w-2xl bg-neutral-900 border border-neutral-800 rounded-3xl p-6 shadow-2xl max-h-[92vh] overflow-y-auto space-y-5 text-white">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-400">{selectedProduct.category}</span>
                    <h3 className="text-lg font-black text-white mt-0.5">{selectedProduct.title}</h3>
                  </div>
                  <button onClick={() => setSelectedProduct(null)} className="p-1 text-neutral-400 hover:text-white text-lg">✕</button>
                </div>

                <img src={selectedProduct.image} alt="detail" className="w-full h-64 rounded-2xl object-cover" />
                <p className="text-xs text-neutral-300 leading-relaxed">{selectedProduct.description}</p>

                <div className="p-4 bg-neutral-950 rounded-2xl text-xs space-y-2">
                  <div className="flex justify-between"><span>Borrowing Rate:</span><strong>₹{selectedProduct.hourlyRate}/hr (₹{selectedProduct.dailyRate}/day)</strong></div>
                  <div className="flex justify-between"><span>Refundable Escrow Deposit:</span><strong className="text-emerald-400">₹{selectedProduct.securityDeposit} (100% Refundable)</strong></div>
                  <div className="flex justify-between"><span>Campus Location:</span><span>{selectedProduct.location} ({selectedProduct.distanceMeters}m away)</span></div>
                  <div className="flex justify-between"><span>Seller Trust:</span><span className="text-emerald-400 font-semibold">{selectedProduct.seller.name} • {selectedProduct.seller.trustScore}% Score</span></div>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    onClick={() => toggleCompare(selectedProduct.id)}
                    className="py-3 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-bold text-xs rounded-xl"
                  >
                    {compareList.includes(selectedProduct.id) ? '✓ In Compare' : '+ Add to Compare'}
                  </button>
                  <button
                    onClick={() => {
                      setAgreementProduct(selectedProduct);
                      setSelectedProduct(null);
                    }}
                    className="py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs rounded-xl shadow-lg shadow-emerald-500/25"
                  >
                    Review Digital Contract & Sign 📝
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 3. DIGITAL BORROWING AGREEMENT MODAL */}
          {agreementProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeSlideUp">
              <div className="w-full max-w-lg bg-neutral-900 border border-neutral-800 rounded-3xl p-6 shadow-2xl max-h-[92vh] overflow-y-auto space-y-4 text-white">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="text-base font-bold text-white">Digital Campus Borrowing Agreement</h3>
                    <p className="text-[11px] text-neutral-400">Contract Ref #{agreementProduct.id} • {agreementProduct.title}</p>
                  </div>
                  <button onClick={() => setAgreementProduct(null)} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                {/* Duration Slider */}
                <div className="p-4 bg-neutral-950 rounded-2xl space-y-2">
                  <div className="flex justify-between text-xs font-bold text-neutral-300">
                    <span>Borrowing Duration:</span>
                    <span className="text-emerald-400">{agreementDuration} Hours</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="72"
                    value={agreementDuration}
                    onChange={(e) => setAgreementDuration(Number(e.target.value))}
                    className="w-full accent-emerald-500 bg-neutral-800 h-2 rounded-lg cursor-pointer"
                  />
                </div>

                {/* Cost Breakdown */}
                <div className="p-4 bg-neutral-950 rounded-2xl space-y-2 text-xs">
                  <div className="flex justify-between text-neutral-300">
                    <span>Borrowing Charge ({agreementDuration} hrs @ ₹{agreementProduct.hourlyRate}/hr):</span>
                    <span>₹{agreementProduct.hourlyRate * agreementDuration}</span>
                  </div>
                  <div className="flex justify-between text-neutral-300">
                    <span>Platform Service Fee ({platformFeeRate}%):</span>
                    <span>₹{Math.round(agreementProduct.hourlyRate * agreementDuration * (platformFeeRate / 100))}</span>
                  </div>
                  <div className="flex justify-between text-emerald-400 font-bold">
                    <span>100% Refundable Security Deposit:</span>
                    <span>₹{agreementProduct.securityDeposit}</span>
                  </div>
                  <div className="pt-2 border-t border-neutral-800 flex justify-between font-extrabold text-sm text-white">
                    <span>Total Upfront Escrow Lock:</span>
                    <span className="text-emerald-400">₹{(agreementProduct.hourlyRate * agreementDuration) + Math.round(agreementProduct.hourlyRate * agreementDuration * (platformFeeRate / 100)) + agreementProduct.securityDeposit}</span>
                  </div>
                </div>

                <div className="p-3 bg-neutral-950 rounded-xl text-[11px] text-neutral-400 flex items-center justify-between">
                  <span>Demo Payment Simulation Mode:</span>
                  <span className="text-emerald-400 font-bold">Auto-Debit Escrow</span>
                </div>

                <button
                  onClick={handleConfirmBorrow}
                  className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs rounded-xl shadow-lg shadow-emerald-500/25 active:scale-95"
                >
                  Confirm Contract & Lock Escrow Deposit
                </button>
              </div>
            </div>
          )}

          {/* 4. USER <-> OWNER CONNECTION WORKFLOW MODAL */}
          {isOwnerConnectionOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeSlideUp">
              <div className="w-full max-w-lg bg-neutral-900 border border-neutral-800 rounded-3xl p-6 shadow-2xl space-y-5 text-white">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="text-base font-bold text-white">Connect with Resource Owner</h3>
                    <p className="text-xs text-neutral-400">Coordinate handover & item pickup</p>
                  </div>
                  <button onClick={() => setIsOwnerConnectionOpen(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                {/* Distance-Based Recommendation */}
                <div className="p-4 rounded-2xl bg-neutral-950 border border-neutral-800 space-y-2">
                  <div className="flex items-center justify-between text-xs">
                    <span className="text-neutral-400">Owner Distance:</span>
                    <strong className="text-white">1.2 km (Hostel 3)</strong>
                  </div>
                  <div className="p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-400 font-bold">
                    📍 Recommended: "Meet Offline" — Owner is nearby on campus!
                  </div>
                </div>

                {/* Options */}
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'offline', label: '📍 Meet Offline', desc: 'Central Library' },
                    { id: 'call', label: '📞 Video Call', desc: 'Demo Call Room' },
                    { id: 'chat', label: '💬 Chat / SMS', desc: 'Campus Messenger' }
                  ].map((m) => (
                    <button
                      key={m.id}
                      onClick={() => setMeetingMethod(m.id)}
                      className={`p-3 rounded-xl border text-left transition-all ${
                        meetingMethod === m.id
                          ? 'bg-neutral-800 border-emerald-500 text-white font-bold'
                          : 'bg-neutral-950 border-neutral-800 text-neutral-400 hover:text-white'
                      }`}
                    >
                      <div className="text-xs">{m.label}</div>
                      <span className="text-[10px] text-neutral-500 block mt-0.5">{m.desc}</span>
                    </button>
                  ))}
                </div>

                {meetingMethod === 'offline' && (
                  <div className="p-4 bg-neutral-950 rounded-2xl space-y-3 text-xs">
                    <div>
                      <label className="block text-neutral-400 mb-1">Suggested Meeting Point:</label>
                      <input
                        type="text"
                        value={meetingLocation}
                        onChange={(e) => setMeetingLocation(e.target.value)}
                        className="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 rounded-xl text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-neutral-400 mb-1">Meeting Time:</label>
                      <input
                        type="text"
                        value={meetingTime}
                        onChange={(e) => setMeetingTime(e.target.value)}
                        className="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 rounded-xl text-white"
                      />
                    </div>
                  </div>
                )}

                <button
                  onClick={handleConfirmMeeting}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs rounded-xl shadow-lg shadow-emerald-500/25"
                >
                  Confirm Meeting & Proceed to Handover
                </button>
              </div>
            </div>
          )}

          {/* 5. LIFECYCLE STAGE CONTEXTUAL DETAIL MODAL */}
          {lifecycleDetailModalStage && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeSlideUp">
              <div className="w-full max-w-lg bg-neutral-900 border border-neutral-800 rounded-3xl p-6 shadow-2xl space-y-4 text-white">
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">{lifecycleDetailModalStage.icon}</span>
                    <div>
                      <h3 className="text-base font-extrabold text-white">Stage {lifecycleDetailModalStage.id}: {lifecycleDetailModalStage.title}</h3>
                      <span className="text-[10px] font-bold text-emerald-400 uppercase">{lifecycleDetailModalStage.key}</span>
                    </div>
                  </div>
                  <button onClick={() => setLifecycleDetailModalStage(null)} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                <p className="text-xs text-neutral-300 bg-neutral-950 p-3.5 rounded-2xl border border-neutral-800 leading-relaxed">
                  {lifecycleDetailModalStage.whatMeans}
                </p>

                <div className="space-y-2 text-xs">
                  <div className="p-3 bg-neutral-950 rounded-xl border border-neutral-800">
                    <strong className="text-emerald-400 block mb-0.5">Borrower Responsibility:</strong>
                    <span className="text-neutral-300">{lifecycleDetailModalStage.borrowerAction}</span>
                  </div>

                  <div className="p-3 bg-neutral-950 rounded-xl border border-neutral-800">
                    <strong className="text-cyan-400 block mb-0.5">Owner Responsibility:</strong>
                    <span className="text-neutral-300">{lifecycleDetailModalStage.ownerAction}</span>
                  </div>

                  <div className="p-3 bg-neutral-950 rounded-xl border border-neutral-800 flex justify-between">
                    <span className="text-neutral-400">Payment & Escrow State:</span>
                    <strong className="text-white">{lifecycleDetailModalStage.paymentStatus}</strong>
                  </div>
                </div>

                <button
                  onClick={() => setLifecycleDetailModalStage(null)}
                  className="w-full py-2.5 bg-neutral-800 hover:bg-neutral-700 text-white font-bold text-xs rounded-xl"
                >
                  Close Stage Inspector
                </button>
              </div>
            </div>
          )}

          {/* 6. BEFORE & AFTER PHOTO INSPECTION SLIDER MODAL */}
          {isInspectorOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeSlideUp">
              <div className="w-full max-w-2xl bg-neutral-900 border border-neutral-800 rounded-3xl p-6 shadow-2xl space-y-4 text-white">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="text-base font-bold">Before & After Photo Condition Inspector</h3>
                    <p className="text-[11px] text-neutral-400">Drag the slider horizontally to audit condition differences</p>
                  </div>
                  <button onClick={() => setIsInspectorOpen(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                <div className="relative h-64 sm:h-80 w-full rounded-2xl overflow-hidden bg-black select-none border border-neutral-700">
                  <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=800&q=80" className="absolute inset-0 w-full h-full object-cover" />
                  <div className="absolute top-2.5 right-2.5 px-2 py-0.5 bg-black/80 text-[10px] text-cyan-400 font-bold rounded">Post-Return</div>

                  <div className="absolute inset-0 overflow-hidden" style={{ width: `${inspectorSlider}%` }}>
                    <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=800&q=80" className="absolute inset-0 w-full h-full object-cover max-w-none" style={{ width: '600px' }} />
                    <div className="absolute top-2.5 left-2.5 px-2 py-0.5 bg-black/80 text-[10px] text-emerald-400 font-bold rounded">Pre-Handover</div>
                  </div>

                  <div className="absolute top-0 bottom-0 w-1 bg-white cursor-ew-resize flex items-center justify-center -translate-x-1/2" style={{ left: `${inspectorSlider}%` }}>
                    <div className="w-6 h-6 rounded-full bg-white text-black font-bold flex items-center justify-center text-[10px] shadow-lg">↔</div>
                  </div>

                  <input
                    type="range"
                    min="0"
                    max="100"
                    value={inspectorSlider}
                    onChange={(e) => setInspectorSlider(Number(e.target.value))}
                    className="absolute inset-0 opacity-0 cursor-ew-resize w-full h-full"
                  />
                </div>

                <button
                  onClick={handleConfirmReturnAndRefund}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs rounded-xl shadow-lg"
                >
                  Approve 100% Pristine Condition & Release Escrow Deposit
                </button>
              </div>
            </div>
          )}

          {/* 7. SIDE BY SIDE COMPARISON MODAL */}
          {isCompareOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeSlideUp">
              <div className="w-full max-w-4xl bg-neutral-900 border border-neutral-800 rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4 text-white">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="text-base font-bold">Side-by-Side Resource Comparator</h3>
                    <p className="text-xs text-neutral-400">Comparing {compareList.length} items on specs, proximity, and trust</p>
                  </div>
                  <button onClick={() => setIsCompareOpen(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {products.filter((p) => compareList.includes(p.id)).map((item) => (
                    <div key={item.id} className="p-4 bg-neutral-950 rounded-2xl border border-neutral-800 space-y-2 text-xs">
                      <img src={item.image} className="w-full h-32 rounded-xl object-cover" />
                      <h4 className="font-bold text-sm text-white line-clamp-1">{item.title}</h4>
                      <div className="text-emerald-400 font-semibold">₹{item.hourlyRate}/hr • Deposit: ₹{item.securityDeposit}</div>
                      <div className="text-neutral-400">Distance: {item.distanceMeters}m ({item.walkTimeMinutes} min walk)</div>
                      <div className="text-neutral-400">Condition: {item.condition}</div>
                      <div className="text-neutral-400">Seller: {item.seller.name} ({item.seller.trustScore}% Trust)</div>
                      <button
                        onClick={() => {
                          setAgreementProduct(item);
                          setIsCompareOpen(false);
                        }}
                        className="w-full py-2 bg-emerald-500 text-black font-extrabold text-xs rounded-xl mt-2"
                      >
                        Borrow This
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TOAST ALERT NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 p-4 rounded-2xl bg-neutral-900/95 border border-emerald-500/50 text-white shadow-2xl animate-fadeSlideUp max-w-sm">
              <h4 className="font-bold text-xs text-emerald-400">{toast.title}</h4>
              <p className="text-xs text-neutral-300 mt-0.5 leading-relaxed">{toast.msg}</p>
            </div>
          )}

          {/* FOOTER */}
          <footer className="w-full border-t border-neutral-900 bg-neutral-950/80 py-8 px-4 sm:px-8 text-neutral-400 text-xs text-center">
            <div className="flex items-center justify-center gap-2 text-white font-bold mb-1">
              <span className="text-emerald-400">●</span>
              <span>CAMPUS CIRCULAR</span>
              <span className="text-neutral-600 font-normal">| From Ownership to Access</span>
            </div>
            <p className="text-neutral-500">
              WebFusion 2.0 Inter-College Frontend Web Development Competition • Coding Club-CodeCrafters
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
